name: Link Check

# External links rot silently. Run this on a schedule rather than on pull
# requests, since sites like Devpost and YouTube intermittently rate-limit CI
# runners and would otherwise fail unrelated PRs.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build site
        run: npm run build
      - name: Check all links
        run: npm run links:all
